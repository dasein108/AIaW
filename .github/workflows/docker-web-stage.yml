name: Docker Image CI STAGE

on:
  push:
    branches:
      - stage
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env.docker
        run: |
          echo "IS_PRODUCTION=true" >> .env.docker
          echo "SEARXNG_URL=${{ secrets.STAGE_SEARXNG_URL }}" >> .env.docker
          echo "LITELLM_URL=${{ secrets.STAGE_LITELLM_URL }}" >> .env.docker
          echo "LITELLM_API_KEY=${{ secrets.STAGE_LITELLM_API_KEY }}" >> .env.docker
          echo "SUPABASE_URL=${{ secrets.STAGE_SUPABASE_URL }}" >> .env.docker
          echo "SUPABASE_KEY=${{ secrets.STAGE_SUPABASE_KEY }}" >> .env.docker
          echo "NEO4J_URI=${{ secrets.STAGE_NEO4J_URI }}" >> .env.docker
          echo "NEO4J_USERNAME=${{ secrets.STAGE_NEO4J_USERNAME }}" >> .env.docker
          echo "NEO4J_PASSWORD=${{ secrets.STAGE_NEO4J_PASSWORD }}" >> .env.docker
          echo "NEO4J_DATABASE=${{ secrets.STAGE_NEO4J_DATABASE }}" >> .env.docker
          echo "BACKEND_URL=${{ secrets.STAGE_BACKEND_URL }}" >> .env.docker

      - name: Build and push
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aiaw:stage
